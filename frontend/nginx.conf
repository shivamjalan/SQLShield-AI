server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing (/logs, /playground, /performance
    # etc. aren't real files) -- fall back to index.html for any path that
    # doesn't match a static asset so a direct load/refresh on those routes
    # doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
